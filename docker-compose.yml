# Desenvolvimento local: SQL Server (banco do portal + bancos dos clientes).
#   docker compose up -d db
#   cd portal && cp .env.example .env && npm install && npx prisma migrate deploy && npm run admin:bootstrap && npm run dev
#   docker build -t ctassessment-job:dev job      # imagem do coletor, usada com JOB_RUNNER=docker
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Troque-esta-senha1
    ports: ["1433:1433"]
    volumes: [mssqldata:/var/opt/mssql]
volumes:
  mssqldata:
