<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CT Assessment – Dashboard</title>
<script>(function(){const t=localStorage.getItem('ct-theme')||'dark';document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root,[data-theme="dark"]{
  --bg:#0d1117;--sidebar:#111418;--card:#161b22;--card2:#1c2128;
  --border:#2d333b;--text:#e6edf3;--muted:#7d8590;--text2:#adbac7;
  --ct-orange:#EA5A1C;--ct-green:#95C11F;--ct-purple:#662483;
  --blue:#EA5A1C;--green:#95C11F;--yellow:#d29922;--red:#f85149;--purple:#c273e2;
  --hero-text:#fff;--shadow:0 1px 3px rgba(0,0,0,.4);
  --theme-icon-sun:none;--theme-icon-moon:block;
}
[data-theme="light"]{
  --bg:#f2f0ec;--sidebar:#fff;--card:#fff;--card2:#f7f6f3;
  --border:#e0ddd8;--text:#111318;--muted:#64748b;--text2:#374151;
  --ct-orange:#EA5A1C;--ct-green:#78a000;--ct-purple:#662483;
  --blue:#EA5A1C;--green:#78a000;--yellow:#b45309;--red:#dc2626;--purple:#9333ea;
  --hero-text:#fff;--shadow:0 1px 4px rgba(0,0,0,.1);
  --theme-icon-sun:block;--theme-icon-moon:none;
}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;min-height:100vh;font-size:14px;line-height:1.5;transition:background .2s,color .2s}
a{color:inherit;text-decoration:none}

/* Sidebar */
.sidebar{width:210px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto}
.logo{padding:18px 16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo-mark{width:32px;height:32px;background:var(--ct-orange);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;flex-shrink:0}
.logo-name{font-size:13.5px;font-weight:700;line-height:1.2}
.logo-sub{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.nav-sect{padding:14px 16px 3px;font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12.5px;color:var(--muted);cursor:pointer;border-left:2px solid transparent;transition:all .15s}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,.04)}
[data-theme="light"] .nav-item:hover{background:rgba(0,0,0,.04)}
.nav-item.active{color:var(--ct-orange);background:rgba(234,90,28,.08);border-left-color:var(--ct-orange)}
.nav-item svg{width:14px;height:14px;flex-shrink:0;opacity:.65}
.nav-item.active svg{opacity:1}
.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border)}
.sidebar-card{background:var(--card2);border:1px solid var(--border);border-radius:9px;padding:10px 11px;display:flex;align-items:center;gap:9px}
.sidebar-card-icon{width:28px;height:28px;border-radius:7px;background:var(--ct-orange);display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:800;flex-shrink:0}
.sidebar-card-text{min-width:0}
.sidebar-card-title{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-card-sub{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}

/* Main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}

/* Topbar row 1: filter bar (execução, tema, exportar) */
.topbar-filters{padding:9px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--sidebar);gap:12px;flex-wrap:wrap}
.exec-wrap{display:flex;align-items:center;gap:6px}
.exec-label{font-size:10.5px;color:var(--muted);white-space:nowrap}
.exec-select{background:var(--card2);border:1px solid var(--border);color:var(--text);padding:5px 10px;border-radius:7px;font-size:11.5px;cursor:pointer;outline:none;max-width:280px}
.exec-select:focus{border-color:var(--ct-orange)}
.topbar-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.theme-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--card2);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .15s;flex-shrink:0}
.theme-btn:hover{color:var(--text);border-color:var(--ct-orange)}
.theme-btn svg{width:14px;height:14px}
.icon-sun{display:var(--theme-icon-sun)}.icon-moon{display:var(--theme-icon-moon)}

/* Topbar row 2: page header (título + filtros/pills) */
.page-header{padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;background:var(--bg);border-bottom:1px solid var(--border)}
.page-header-left{display:flex;align-items:center;gap:12px;min-width:0}
.page-header-icon{width:38px;height:38px;border-radius:10px;background:rgba(234,90,28,.12);display:flex;align-items:center;justify-content:center;color:var(--ct-orange);flex-shrink:0}
.page-header-icon svg{width:18px;height:18px}
.page-header-title{font-size:18px;font-weight:800;letter-spacing:-.3px}
.page-header-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.page-header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.date-badge{font-size:11px;color:var(--text2);background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.date-badge svg{width:12px;height:12px;opacity:.7;flex-shrink:0}
.delta-badge{font-size:10.5px;font-weight:700;padding:6px 11px;border-radius:8px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.delta-badge.up{background:rgba(149,193,31,.14);color:var(--green)}
.delta-badge.down{background:rgba(248,81,73,.14);color:var(--red)}
.delta-badge.flat{background:var(--card2);color:var(--muted)}

.content{flex:1;padding:22px 24px;overflow-y:auto}

/* Hero */
.hero{border-radius:14px;background:linear-gradient(135deg,var(--ct-orange) 0%,#c04010 40%,var(--ct-purple) 100%);padding:30px 38px;margin-bottom:18px;position:relative;overflow:hidden;color:#fff}
.hero::before{content:'';position:absolute;right:-50px;top:-70px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.05);pointer-events:none}
.hero::after{content:'';position:absolute;right:100px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.04);pointer-events:none}
.hero-layout{display:grid;grid-template-columns:1fr auto;align-items:flex-end;gap:28px;position:relative;z-index:1}
@media(max-width:900px){.hero-layout{grid-template-columns:1fr}}
.hero-eyebrow{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:2px;opacity:.7;margin-bottom:10px}
.hero-amount{font-size:58px;font-weight:900;line-height:1;letter-spacing:-2px;margin-bottom:6px}
.hero-amount span{font-size:20px;font-weight:400;opacity:.65;margin-left:4px}
.hero-desc{font-size:13px;opacity:.75;line-height:1.5;max-width:480px}
.hero-pills{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.hero-pill{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:9px;padding:9px 14px;text-align:center;min-width:90px}
.hero-pill-label{font-size:9px;text-transform:uppercase;letter-spacing:.8px;opacity:.65;margin-bottom:4px}
.hero-pill-value{font-size:17px;font-weight:800;letter-spacing:-.5px;line-height:1}
.hero-pill-period{font-size:9px;opacity:.5;margin-top:2px}

/* KPI strip */
.kpi-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
@media(max-width:1100px){.kpi-strip{grid-template-columns:repeat(2,1fr)}}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:border-color .2s,box-shadow .2s}
.kpi-card:hover{border-color:var(--ct-orange);box-shadow:var(--shadow)}
.kpi-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px}
.kpi-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.kpi-icon svg{width:15px;height:15px}
.kpi-delta{font-size:10px;font-weight:700;display:flex;align-items:center;gap:2px;white-space:nowrap}
.kpi-delta.up{color:var(--green)}.kpi-delta.down{color:var(--red)}
.kpi-label{font-size:9.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.kpi-value{font-size:22px;font-weight:900;line-height:1;letter-spacing:-.5px}
.kpi-sub{font-size:10px;color:var(--muted);margin-top:5px}
.kpi-spark{display:block;margin-top:8px}
.c-orange{color:var(--ct-orange)}.c-green{color:var(--green)}.c-yellow{color:var(--yellow)}
.c-red{color:var(--red)}.c-purple{color:var(--purple)}.c-muted{color:var(--muted)}

/* Trend line/area charts (SVG, sem dependências externas) */
.chart-card-body{padding:12px 15px 6px}
.chart-legend{display:flex;gap:14px;padding:0 15px 12px;flex-wrap:wrap}
.chart-legend-item{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted)}
.chart-legend-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.chart-legend-line{width:12px;height:2px;border-radius:1px;flex-shrink:0}
.line-chart{overflow:visible}
.chart-hit{cursor:crosshair}
.chart-guide{pointer-events:none;transition:opacity .1s ease}
.chart-dot{transition:r .1s ease}
.chart-dot.hover{r:4.5}
.chart-tooltip{
  position:fixed;z-index:50;pointer-events:none;opacity:0;transition:opacity .1s ease;
  background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 11px;
  box-shadow:var(--shadow,0 4px 16px rgba(0,0,0,.25));font-size:11.5px;min-width:130px;
}
.chart-tooltip.show{opacity:1}
.chart-tooltip-label{font-weight:700;margin-bottom:5px;color:var(--text)}
.chart-tooltip-row{display:flex;align-items:center;gap:6px;justify-content:space-between;padding:1.5px 0}
.chart-tooltip-row+.chart-tooltip-row{margin-top:1px}
.chart-tooltip-name{display:flex;align-items:center;gap:6px;color:var(--muted)}
.chart-tooltip-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.chart-tooltip-val{font-weight:700;font-variant-numeric:tabular-nums;margin-left:10px;color:var(--text)}

/* Histórico de execuções */
.exec-hist-grid{display:grid;grid-template-columns:1fr 250px;gap:14px;margin-bottom:22px}
@media(max-width:1000px){.exec-hist-grid{grid-template-columns:1fr}}

/* Section header */
.sec-hd{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;margin-bottom:12px;display:flex;align-items:center;gap:8px;position:relative;padding-right:24px;cursor:pointer;user-select:none;border-radius:6px}
.sec-hd:hover{color:var(--text)}
.sec-hd::after{content:'';flex:1;height:1px;background:var(--border)}
.sec-hd-accent{width:3px;height:13px;background:var(--ct-orange);border-radius:2px;flex-shrink:0}
.sec-chevron{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:13px;height:13px;flex-shrink:0;transition:transform .18s ease}
.sec-chevron svg{width:100%;height:100%;display:block}
.sec-hd.collapsed .sec-chevron{transform:translateY(-50%) rotate(-90deg)}
.sec-collapsed-content{display:none!important}

/* Two-col */
.two-col{display:grid;grid-template-columns:1fr 290px;gap:14px;margin-bottom:22px}
@media(max-width:1100px){.two-col{grid-template-columns:1fr}}

/* Maturity table */
.mat-card{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.mat-table{width:100%;border-collapse:collapse}
.mat-table th{background:var(--card2);padding:8px 13px;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;text-align:left;border-bottom:1px solid var(--border)}
.mat-table th:not(:first-child){text-align:center}
.mat-table td{padding:9px 13px;border-bottom:1px solid var(--border);font-size:12px}
.mat-table td:not(:first-child){text-align:center}
.mat-table tr:last-child td{border-bottom:0}
.mat-table tr:hover td{background:rgba(234,90,28,.03)}
.score-cell{display:inline-flex;align-items:center;justify-content:center;width:38px;height:22px;border-radius:5px;font-size:10.5px;font-weight:700}
.score-5{background:rgba(149,193,31,.18);color:#95C11F}.score-4{background:rgba(149,193,31,.1);color:#aad435}
.score-3{background:rgba(210,153,34,.18);color:#d29922}.score-2{background:rgba(248,81,73,.14);color:#f85149}
.score-1{background:rgba(248,81,73,.22);color:#ff4444}.score-na{background:rgba(125,133,144,.08);color:var(--muted)}

/* Risk card */
.risk-card{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden;display:flex;flex-direction:column}
.risk-hd{padding:11px 15px;border-bottom:1px solid var(--border);background:var(--card2)}
.risk-hd-title{font-size:12px;font-weight:600}
.risk-hd-sub{font-size:10.5px;color:var(--muted);margin-top:1px}
.risk-list{list-style:none;flex:1}
.risk-item{display:flex;align-items:flex-start;gap:9px;padding:9px 13px;border-bottom:1px solid rgba(45,51,59,.6)}
[data-theme="light"] .risk-item{border-bottom-color:var(--border)}
.risk-item:last-child{border-bottom:0}
.risk-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;margin-top:5px}
.risk-dot.high{background:var(--red)}.risk-dot.medium{background:var(--yellow)}.risk-dot.low{background:var(--ct-orange)}.risk-dot.info{background:var(--muted)}
.risk-title{font-size:11.5px;font-weight:500;margin-bottom:1px}
.risk-desc{font-size:10.5px;color:var(--muted);line-height:1.4}
.risk-badge{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:1px 5px;border-radius:3px;margin-right:4px}
.risk-badge.high{background:rgba(248,81,73,.18);color:var(--red)}
.risk-badge.medium{background:rgba(210,153,34,.18);color:var(--yellow)}
.risk-badge.low{background:rgba(234,90,28,.15);color:var(--ct-orange)}
.no-risk{padding:22px;color:var(--muted);font-size:12px;text-align:center}

/* Critical sites */
.crit-table{width:100%;border-collapse:collapse}
.crit-table th{background:var(--card2);padding:7px 13px;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;text-align:left;border-bottom:1px solid var(--border)}
.crit-table td{padding:9px 13px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.crit-table tr:last-child td{border-bottom:0}
.crit-table tr:hover td{background:rgba(248,81,73,.03)}
.crit-title{font-weight:500;display:flex;align-items:center;gap:6px}
.crit-url{font-size:10.5px;color:var(--muted);margin-top:1px;word-break:break-all}
.crit-badge{font-size:9px;font-weight:700;padding:2px 6px;border-radius:3px;background:rgba(248,81,73,.18);color:var(--red);white-space:nowrap;flex-shrink:0}
.kw-tag{font-size:9px;background:rgba(234,90,28,.15);color:var(--ct-orange);padding:1px 5px;border-radius:3px;font-weight:600}
.crit-cap{font-size:10.5px;color:var(--muted)}
.empty-crit{padding:20px;text-align:center;color:var(--muted);font-size:12px}

/* Sites toolbar (all sites tables) */
.sites-toolbar{display:flex;align-items:center;justify-content:space-between;padding:10px 13px;background:var(--card2);border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.sites-count{font-size:11px;color:var(--muted)}
.sites-order-select{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:6px;font-size:11px;cursor:pointer;outline:none}
.sites-order-select:focus{border-color:var(--ct-orange)}

/* Diag cards (cost reduction) */
.diag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
@media(max-width:1100px){.diag-grid{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.diag-grid{grid-template-columns:1fr}}
.diag-card{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s,box-shadow .2s}
.diag-card:hover{border-color:var(--ct-orange);box-shadow:0 0 0 1px rgba(234,90,28,.15)}
.diag-stripe{height:3px;flex-shrink:0}
.diag-body{padding:20px 20px 14px;flex:1}
.diag-type{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1.6px;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px}
.diag-headline{font-size:12.5px;font-weight:600;color:var(--text);line-height:1.45;margin-bottom:16px}
.diag-stat{font-size:36px;font-weight:900;letter-spacing:-1.5px;line-height:1;margin-bottom:3px}
.diag-stat-sub{font-size:11px;color:var(--muted);line-height:1.4}
.diag-footer{padding:12px 20px;border-top:1px solid var(--border);background:var(--card2);display:flex;align-items:baseline;gap:7px;margin-top:auto}
.diag-sav-label{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;flex:1}
.diag-sav-amount{font-size:22px;font-weight:900;color:var(--green);letter-spacing:-1px}
.diag-sav-period{font-size:10px;color:var(--muted)}

/* Metric cards */
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.metric-card-hd{padding:10px 15px;border-bottom:1px solid var(--border);background:var(--card2);display:flex;align-items:center;gap:7px}
.metric-card-hd svg{width:14px;height:14px;opacity:.8;flex-shrink:0}
.metric-card-title{font-size:11.5px;font-weight:600}
.mrow{display:flex;align-items:center;justify-content:space-between;padding:7px 15px;border-bottom:1px solid rgba(45,51,59,.5)}
[data-theme="light"] .mrow{border-bottom-color:var(--border)}
.mrow:last-child{border-bottom:0}
.mrow-lbl{font-size:11.5px;color:var(--muted)}
.mrow-val{font-size:12px;font-weight:600;text-align:right}
.storage-row{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:14px;margin-bottom:22px}
@media(max-width:1000px){.storage-row{grid-template-columns:1fr 1fr}}
.storage-visual{display:flex;align-items:center;gap:16px;padding:12px 15px}
.storage-stats{flex:1}
.storage-stat{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.storage-stat:last-child{margin-bottom:0}
.storage-stat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.storage-stat-label{font-size:10.5px;color:var(--muted);flex:1}
.storage-stat-val{font-size:11.5px;font-weight:600}
.pbar-wrap{padding:4px 15px 11px}
.pbar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:4px}
.pbar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;border-radius:2px;transition:width .8s ease}

/* File types grouped */
.ftype-groups{padding:10px 15px 14px}
.ftype-group{margin-bottom:10px}
.ftype-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:4px}
.ftype-name{font-weight:600;color:var(--text)}
.ftype-exts{font-size:9.5px;color:var(--muted);margin-left:4px}
.ftype-cnt{color:var(--muted);font-size:10.5px}
.ftype-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden}
.ftype-fill{height:100%;border-radius:3px;transition:width .9s ease}

/* Year filter */
.yf-bar{display:flex;gap:4px;margin-bottom:14px}
.yf-btn{font-size:10px;font-weight:700;padding:4px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;transition:all .15s;text-transform:uppercase;letter-spacing:.5px}
.yf-btn:hover{border-color:var(--ct-orange);color:var(--ct-orange)}
.yf-btn.active{background:var(--ct-orange);border-color:var(--ct-orange);color:#fff}

/* Waterfall / reduction */
.waterfall{padding:14px 15px}
.wf-row{margin-bottom:12px}
.wf-row:last-child{margin-bottom:0}
.wf-lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;margin-bottom:4px}
.wf-title{font-weight:500}
.wf-value{font-weight:700;font-size:12px}
.wf-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;position:relative}
.wf-fill{height:100%;border-radius:4px;transition:width .9s ease}
.wf-delta{font-size:9.5px;color:var(--green);margin-top:2px}
.runway-panel{padding:14px 15px}
.runway-stat{margin-bottom:14px}
.runway-stat:last-child{margin-bottom:0}
.runway-big{font-size:32px;font-weight:900;letter-spacing:-1.5px;line-height:1;margin-bottom:2px}
.runway-sub{font-size:11px;color:var(--muted)}
.runway-divider{height:1px;background:var(--border);margin:12px 0}

/* Organic growth */
.growth-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:22px}
@media(max-width:900px){.growth-grid{grid-template-columns:1fr}}
.og-table{width:100%;border-collapse:collapse}
.og-table th{background:var(--card2);padding:7px 13px;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;text-align:left;border-bottom:1px solid var(--border)}
.og-table th:not(:first-child){text-align:right}
.og-table td{padding:8px 13px;border-bottom:1px solid var(--border);font-size:12px}
.og-table td:not(:first-child){text-align:right;font-weight:600}
.og-table tr:last-child td{border-bottom:0}
.og-table tr:hover td{background:rgba(234,90,28,.03)}
.og-year{font-weight:500;font-size:12px}
.og-bar-cell{padding:6px 13px!important;width:220px}
.og-bar-wrap{position:relative;height:14px;background:var(--border);border-radius:3px;overflow:visible}
.og-bar-fill{position:absolute;top:0;left:0;height:100%;border-radius:3px;transition:width .8s ease}
.og-bar-clean{position:absolute;top:0;left:0;height:100%;border-radius:3px;transition:width .8s ease;opacity:.55}
.og-quota-line{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--red);border-radius:1px;opacity:.8;z-index:2}
.og-rate{padding:12px 15px;border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:20px;flex-wrap:wrap}
.og-rate-item{display:flex;flex-direction:column;gap:2px}
.og-rate-val{font-size:15px;font-weight:700;color:var(--text)}
.og-legend{display:flex;gap:14px;padding:10px 13px;border-bottom:1px solid var(--border)}
.og-legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0;margin-top:2px}
.og-legend-lbl{font-size:10.5px;color:var(--muted)}

/* Donut */
.donut-wrap{position:relative;display:inline-block}

/* States */
.loading{display:flex;align-items:center;justify-content:center;height:200px;color:var(--muted);gap:10px}
.spinner{width:16px;height:16px;border:2px solid var(--border);border-top-color:var(--ct-orange);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.22);border-radius:9px;padding:13px 15px;color:var(--red);font-size:12px;margin-bottom:14px}
.empty-msg{color:var(--muted);font-size:12px;padding:14px;text-align:center}

/* Export PDF button */
.export-btn{width:auto;padding:0 12px;gap:6px;display:flex;align-items:center;font-size:11.5px;font-weight:600;color:var(--text)}
.export-btn svg{width:13px;height:13px}
.export-btn:disabled{opacity:.55;cursor:default}

/* Tabs (Visão Geral / SharePoint / OneDrive) */
.tab-bar{display:flex;gap:6px;margin-bottom:18px;border-bottom:1px solid var(--border);padding-bottom:0}
.tab-btn{font-size:12.5px;font-weight:600;padding:9px 16px;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;display:flex;align-items:center;gap:7px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--ct-orange);border-bottom-color:var(--ct-orange)}
.tab-btn svg{width:13px;height:13px}
.tab-count{font-size:9.5px;font-weight:700;background:var(--card2);color:var(--muted);border-radius:9px;padding:1px 7px}
.tab-btn.active .tab-count{background:rgba(234,90,28,.14);color:var(--ct-orange)}
.tab-panel{display:none}
.tab-panel.active{display:block}
.tab-print-title{display:none}

/* Documentos com mais versões (SharePoint/OneDrive) */
.doc-table{width:100%;border-collapse:collapse}
.doc-table th{background:var(--card2);padding:7px 13px;font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;text-align:left;border-bottom:1px solid var(--border)}
.doc-table th:not(:first-child){text-align:right}
.doc-table td{padding:8px 13px;border-bottom:1px solid var(--border);font-size:12px;vertical-align:middle}
.doc-table td:not(:first-child){text-align:right}
.doc-table tr:last-child td{border-bottom:0}
.doc-table tr:hover td{background:rgba(234,90,28,.03)}
.doc-name{font-weight:500;display:block}
.doc-name a{color:var(--ct-orange)}
.doc-name a:hover{text-decoration:underline}
.doc-site{font-size:10.5px;color:var(--muted);margin-top:1px}
.ver-badge{display:inline-flex;align-items:center;justify-content:center;min-width:32px;padding:2px 6px;border-radius:5px;font-size:10.5px;font-weight:700;background:rgba(210,153,34,.16);color:var(--yellow)}

/* Print header (visible only when printing/exporting) */
.print-header{display:none}

/* Print stylesheet: turns the live dashboard into a clean PDF-ready report */
@media print{
  :root,[data-theme="dark"],[data-theme="light"]{
    --bg:#fff;--sidebar:#fff;--card:#fff;--card2:#f7f6f3;
    --border:#d7d7d7;--text:#14161a;--muted:#57606a;--text2:#2b2f36;
  }
  @page{margin:14mm 12mm}
  body{display:block!important}
  .sidebar,.topbar-filters,.page-header,.loading,.yf-bar,.tab-bar{display:none!important}
  .main{width:100%!important}
  .content{padding:0!important;overflow:visible!important}
  .tab-panel{display:block!important}
  .print-header{display:block;margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--ct-orange)}
  .print-header-logo{font-size:18px;font-weight:900;color:#14161a}
  .print-header-meta{font-size:11px;color:#57606a;margin-top:4px}
  .kpi-card,.risk-card,.metric-card,.diag-card,.storage-row>*,.growth-grid>*,.exec-hist-grid>*{break-inside:avoid;box-shadow:none!important}
  .mat-card{box-shadow:none!important}
  .hero{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .diag-stripe,.risk-dot,.kpi-icon{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sec-hd{break-after:avoid;margin-top:18px;cursor:default}
  .sec-chevron{display:none!important}
  .sec-collapsed-content{display:block!important}
  .tab-print-title{display:block!important;font-size:16px;font-weight:800;margin:26px 0 14px;padding-bottom:8px;border-bottom:1px solid #d7d7d7}

  /* Tabelas longas (Todos os Sites, Top 20 Documentos etc.) precisam poder
     quebrar entre paginas - o card que as envolve (.mat-card) NAO pode ter
     break-inside:avoid, senao o navegador tenta forcar a tabela inteira
     numa pagina so e corta o que nao coube. Em compensacao, uma LINHA
     nunca deve ser partida ao meio, e o cabecalho repete em cada pagina. */
  table{break-inside:auto}
  thead{display:table-header-group}
  tfoot{display:table-footer-group}
  tr{break-inside:avoid;break-after:auto}
  .sites-toolbar{break-after:avoid;break-inside:avoid}

  /* Grids lado a lado (ex: "Top 10 Sites" - duas crit-table com URL longa)
     espremem cada tabela pra menos da metade da largura da pagina impressa,
     cortando a ultima coluna. Empilha em 1 coluna so na impressao - a
     regra de quebra de pagina acima ja deixa cada tabela paginar limpo. */
  .two-col,.growth-grid,.storage-row,.exec-hist-grid{grid-template-columns:1fr!important}
}
</style>
</head>

<script>
/* ── Theme ── */
document.getElementById('theme-toggle').addEventListener('click',function(){
  const h=document.documentElement,next=h.getAttribute('data-theme')==='dark'?'light':'dark';
  h.setAttribute('data-theme',next);localStorage.setItem('ct-theme',next);
});

/* ── Export PDF (impressão nativa do navegador, sem dependências externas) ── */
document.getElementById('export-pdf-btn').addEventListener('click',function(){
  window.print();
});

/* ── Export HTML — snapshot estático do relatório em 1 arquivo só ──
   Usa o que já está renderizado na tela (nada de nova consulta ao banco):
   clona #page-content, expande as seções colapsadas, remove os controles que
   só funcionam com JS (chevron, filtros de ano/versão, ordenação) e empilha
   todas as abas, já que o arquivo exportado não tem navegação. O CSS vai
   embutido, então o arquivo abre sozinho em qualquer lugar, offline. ── */
function exportHtmlReport(){
  const styleEl=document.querySelector('style');
  const css=styleEl?styleEl.textContent:'';

  const clone=document.getElementById('page-content').cloneNode(true);
  // Colapsáveis: volta tudo a ficar visível (o dashboard abre colapsado)
  clone.querySelectorAll('.sec-collapsed-content').forEach(el=>el.classList.remove('sec-collapsed-content'));
  clone.querySelectorAll('.sec-hd').forEach(el=>el.classList.remove('collapsed'));
  // Remove só o que não tem como funcionar no arquivo exportado. Os filtros
  // de ano/versão (.yf-bar) e o tooltip dos gráficos CONTINUAM funcionando -
  // bindReportInteractions vai junto no arquivo (ver abaixo). Já a ordenação
  // das tabelas depende de dados em memória (SITE_TABLES), que não são
  // exportados, então esse seletor sai.
  clone.querySelectorAll('.sec-chevron,.sites-order-select,.tab-bar').forEach(el=>el.remove());

  // Cada aba do dashboard vira um bloco colapsável no export (não há barra de
  // abas num arquivo estático). Os rótulos saem dos próprios botões de aba,
  // sem o contador (badge). Primeiro bloco abre expandido; os demais entram
  // colapsados, pra dar uma visão geral compacta ao abrir o arquivo.
  const tabLabels={};
  document.querySelectorAll('.tab-btn').forEach(b=>{
    const key=b.getAttribute('data-tab');
    if(!key)return;
    // Clona e remove o badge antes de ler o texto - mais seguro que dar
    // replace no número (um rótulo que contivesse dígitos seria mutilado).
    const lbl=b.cloneNode(true);
    const badge=lbl.querySelector('.tab-count');
    if(badge)badge.remove();
    tabLabels[key]=(lbl.textContent||'').trim();
  });
  const blocksHtml=Array.from(clone.querySelectorAll('.tab-panel')).map((panel,i)=>{
    const key=panel.getAttribute('data-tab')||'';
    const label=tabLabels[key]||key||('Bloco '+(i+1));
    return '<section class="xblock'+(i===0?'':' collapsed')+'">'+
             '<button type="button" class="xblock-hd">'+label+'<span class="xblock-chev">&#9662;</span></button>'+
             '<div class="xblock-body">'+panel.innerHTML+'</div>'+
           '</section>';
  }).join('');

  const execSel=document.getElementById('exec-select');
  const execTxt=execSel&&execSel.selectedIndex>=0?execSel.options[execSel.selectedIndex].text:'';
  const now=new Date();
  const stamp=now.toLocaleDateString('pt-BR')+' '+now.toLocaleTimeString('pt-BR');

  const html=`<!doctype html>
<html lang="pt-BR" data-theme="${document.documentElement.getAttribute('data-theme')||'light'}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CT Assessment — Diagnóstico SharePoint Online</title>
<style>
${css}
/* Ajustes do export estático (sem sidebar/topbar/abas) */
body{display:block}
.export-wrap{max-width:1400px;margin:0 auto;padding:24px}
.export-head{border-bottom:2px solid var(--ct-orange);padding-bottom:12px;margin-bottom:20px}
.export-head-title{font-size:20px;font-weight:800}
.export-head-sub{font-size:12px;color:var(--muted);margin-top:3px}
.tab-bar{display:none!important}
.tab-panel{display:block!important}
/* Cada aba vira um bloco colapsável */
.xblock{border:1px solid var(--border);border-radius:11px;margin-bottom:14px;overflow:hidden;background:var(--card)}
.xblock-hd{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;background:var(--card2);border:0;border-bottom:1px solid var(--border);color:var(--text);font-family:inherit;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;cursor:pointer;text-align:left}
.xblock-hd:hover{color:var(--ct-orange)}
.xblock-chev{font-size:12px;color:var(--muted);transition:transform .15s}
.xblock.collapsed .xblock-chev{transform:rotate(-90deg)}
.xblock.collapsed .xblock-body{display:none}
.xblock.collapsed .xblock-hd{border-bottom:0}
.xblock-body{padding:16px}
@media print{
  .xblock.collapsed .xblock-body{display:block}
  .xblock-chev{display:none}
}

/* ── Formatters ── */
function fmtNum(n,d=0){return n!=null?Number(n).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d}):'—'}
function fmtGB(b){if(!b||b<=0)return'0 GB';const g=b/1073741824;return g>=1?fmtNum(g,2)+' GB':fmtNum(b/1048576,1)+' MB'}
function fmtMB(m){if(!m||m<=0)return'0 GB';const g=m/1024;return g>=1?fmtNum(g,2)+' GB':fmtNum(m,0)+' MB'}
function fmtUSD(v){if(!v||v<=0)return'$0';return'$'+Math.round(v).toLocaleString('en-US')}
function pct(a,b){return b&&b>0?Math.round(a/b*100):0}
function clamp(v,mn,mx){return Math.max(mn,Math.min(mx,v))}

/* ── File type groups ── */
const FILE_GROUPS={
  'Word':       {exts:['doc','docx','odt'],color:'#2b7fd4'},
  'Excel':      {exts:['xls','xlsx','ods','csv'],color:'#1e7f45'},
  'PowerPoint': {exts:['ppt','pptx','odp'],color:'#c44b0b'},
  'PDF':        {exts:['pdf'],color:'#e53e3e'},
  'Imagem':     {exts:['jpg','jpeg','png','gif','bmp','svg','webp','tiff','tif','heic','heif'],color:'#9333ea'},
  'Vídeo':      {exts:['mp4','avi','mov','mkv','wmv','flv','webm','mpeg','mpg','m4v'],color:'#d97706'},
  'Áudio':      {exts:['mp3','wav','ogg','flac','aac','wma','m4a'],color:'#0891b2'},
  'Comprimido': {exts:['zip','rar','7z','tar','gz','bz2','xz'],color:'#6b7280'},
  'Email':      {exts:['msg','eml','pst','ost'],color:'#059669'},
  'Código':     {exts:['js','ts','py','cs','java','cpp','c','h','php','rb','go','rs','html','css','sql','ps1','sh','bat'],color:'#7c3aed'},
};
function groupFileTypes(ft){
  const groups={};
  for(const f of ft){
    const t=(f.type||'').toLowerCase();
    let matched=false;
    for(const[name,def] of Object.entries(FILE_GROUPS)){
      if(def.exts.includes(t)){
        if(!groups[name])groups[name]={count:0,size_bytes:0,color:def.color,exts:[]};
        groups[name].count+=f.count;groups[name].size_bytes+=f.size_bytes;
        if(!groups[name].exts.includes(t))groups[name].exts.push(t);
        matched=true;break;
      }
    }
    if(!matched){
      const k='Outros';
      if(!groups[k])groups[k]={count:0,size_bytes:0,color:'var(--muted)',exts:[]};
      groups[k].count+=f.count;groups[k].size_bytes+=f.size_bytes;
      groups[k].exts.push(t);
    }
  }
  return Object.entries(groups).map(([n,d])=>({name:n,...d})).sort((a,b)=>b.size_bytes-a.size_bytes);
}

/* ── Interações do relatório: filtros de ano/versão (.yf-btn) e tooltip dos
   gráficos de linha. Propositalmente SELF-CONTAINED (todo o estado dentro da
   própria função, sem depender de nada do resto do arquivo): além de rodar no
   dashboard, esta função é serializada via toString() dentro do HTML exportado
   (ver exportHtmlReport), então o export mantém filtros e tooltip funcionando
   sem duplicar código. Se mexer aqui, vale nos dois lugares. ── */
function bindReportInteractions(){
  let tipEl=null;
  const ensureTip=()=>{
    if(!tipEl){
      tipEl=document.createElement('div');
      tipEl.className='chart-tooltip';
      document.body.appendChild(tipEl);
    }
    return tipEl;
  };
  const hideTip=()=>{
    if(tipEl)tipEl.classList.remove('show');
    document.querySelectorAll('.chart-guide').forEach(g=>g.setAttribute('opacity','0'));
    document.querySelectorAll('.chart-dot.hover').forEach(d=>d.classList.remove('hover'));
  };

  // Filtros de ano (arquivamento) e de nº de versões (histórico de versões)
  document.addEventListener('click',function(e){
    const btn=e.target.closest('.yf-btn');
    if(!btn)return;
    const bar=btn.closest('.yf-bar');
    if(!bar)return;
    bar.querySelectorAll('.yf-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const yr=btn.getAttribute('data-year');
    const card=btn.closest('.diag-card')||btn.closest('.metric-card');
    if(!card)return;
    card.querySelectorAll('[data-y]').forEach(el=>{
      el.style.display=el.getAttribute('data-y')===yr?'':'none';
    });
  });

  // Tooltip de hover nos gráficos de linha - mostra o valor de cada série
  // (ex: mês atual + acumulado) juntos, na posição do mouse.
  document.addEventListener('mousemove',function(e){
    const hit=e.target.closest('.chart-hit');
    if(!hit){ hideTip(); return; }
    const svg=hit.closest('.line-chart');
    if(!svg){ hideTip(); return; }
    const idx=hit.getAttribute('data-idx');
    const cx=hit.getAttribute('data-cx');
    let point=null;
    try{ point=JSON.parse(svg.getAttribute('data-tip'))[idx]; }catch(err){ point=null; }
    if(!point){ hideTip(); return; }

    svg.querySelectorAll('.chart-dot').forEach(d=>{
      d.classList.toggle('hover', d.getAttribute('data-idx')===idx);
    });
    const guide=svg.querySelector('.chart-guide');
    if(guide){ guide.setAttribute('x1',cx); guide.setAttribute('x2',cx); guide.setAttribute('opacity','1'); }

    const tip=ensureTip();
    tip.innerHTML='<div class="chart-tooltip-label">'+point.l+'</div>'+point.s.map(s=>
      '<div class="chart-tooltip-row">'+
        '<span class="chart-tooltip-name"><span class="chart-tooltip-dot" style="background:'+s.c+'"></span>'+s.n+'</span>'+
        '<span class="chart-tooltip-val">'+s.v+'</span>'+
      '</div>').join('');
    tip.classList.add('show');

    const pad=14;
    let left=e.clientX+pad, top=e.clientY+pad;
    const box=tip.getBoundingClientRect();
    if(left+box.width>window.innerWidth-8) left=e.clientX-box.width-pad;
    if(top+box.height>window.innerHeight-8) top=e.clientY-box.height-pad;
    tip.style.left=left+'px';
    tip.style.top=top+'px';
  });
  document.addEventListener('mouseout',function(e){
    if(!e.relatedTarget)hideTip();
  });
}

/* ── Donut SVG ── */
function donut(p,color,label,size=70){
  const pv=clamp(Math.round(p),0,100);
  return`<svg width="${size}" height="${size}" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="15.9" fill="none" stroke="var(--border)" stroke-width="2.5"/>

      stroke-dasharray="${pv} ${100-pv}" stroke-linecap="round" transform="rotate(-90 18 18)"
      style="transition:stroke-dasharray .8s ease"/>
    ${label?`<text x="18" y="20.5" text-anchor="middle" fill="var(--text)" font-size="7" font-weight="700" font-family="-apple-system,sans-serif">${label}</text>`:''}
  </svg>`;
}

/* ── Sparkline SVG (usada nos KPI cards, alimentada por histórico real de execuções) ── */
function sparkline(values,color,w=110,h=28){
  if(!values||values.length<2)return'';
  const min=Math.min(...values),max=Math.max(...values);
  const span=Math.max(1,max-min);
  const step=w/(values.length-1);
  const pts=values.map((v,i)=>`${(i*step).toFixed(1)},${(h-2-((v-min)/span)*(h-4)).toFixed(1)}`);
  const areaPts=`0,${h} ${pts.join(' ')} ${w},${h}`;
  return`<svg class="kpi-spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polygon points="${areaPts}" fill="${color}" opacity=".12"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

/* ── Line/área chart multi-série (SVG puro, sem libs) ── */
function lineChart(series,labels,opts={}){
  const w=opts.w||560,h=opts.h||190,padL=opts.padL||42,padB=opts.padB||20,padT=opts.padT||10,padR=opts.padR||10;
  const innerW=w-padL-padR,innerH=h-padT-padB;
  const allVals=series.flatMap(s=>s.values);
  let max=opts.max!=null?opts.max:Math.max(...allVals,1);
  let min=opts.min!=null?opts.min:Math.min(0,...allVals);
  if(max===min)max=min+1;
  const n=labels.length;
  const x=i=>padL+(n>1?i*(innerW/(n-1)):innerW/2);
  const y=v=>padT+innerH-((v-min)/(max-min))*innerH;
  const fmt=opts.fmt||(v=>fmtNum(Math.round(v)));
  const gridN=4;
  const gridLines=Array.from({length:gridN+1},(_,i)=>{
    const gv=min+(max-min)*i/gridN;
    const gy=y(gv);
    return`<line x1="${padL}" y1="${gy.toFixed(1)}" x2="${w-padR}" y2="${gy.toFixed(1)}" stroke="var(--border)" stroke-width="1"/>
      <text x="${padL-6}" y="${(gy+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)" font-family="-apple-system,sans-serif">${opts.fmt?opts.fmt(gv):Math.round(gv)}</text>`;
  }).join('');
  const labelEls=labels.map((lb,i)=>`<text x="${x(i).toFixed(1)}" y="${h-4}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="-apple-system,sans-serif">${lb}</text>`).join('');
  const seriesEls=series.map(s=>{
    const pts=s.values.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const area=s.area?`<polygon points="${x(0).toFixed(1)},${y(min).toFixed(1)} ${pts} ${x(n-1).toFixed(1)},${y(min).toFixed(1)}" fill="${s.color}" opacity=".12"/>`:'';
    const dots=s.values.map((v,i)=>`<circle class="chart-dot" data-idx="${i}" data-color="${s.color}" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="2.5" fill="${s.color}"/>`).join('');
    return`${area}<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${dots}`;
  }).join('');

  // Dados do tooltip: 1 entrada por indice (mes/label), com o valor de CADA
  // serie formatado (ex: criado no mes + acumulado juntos), lido pelo hover.
  const tipData=labels.map((lb,i)=>({
    l:lb,
    s:series.map(s=>({n:s.name||'',v:fmt(s.values[i]),c:s.color}))
  }));
  const colW=n>1?innerW/(n-1):innerW;
  const hitCols=labels.map((lb,i)=>{
    const cx=x(i);
    const left=Math.max(padL,cx-colW/2).toFixed(1);
    const width=(Math.min(w-padR,cx+colW/2)-Math.max(padL,cx-colW/2)).toFixed(1);
    return`<rect class="chart-hit" data-idx="${i}" data-cx="${cx.toFixed(1)}" x="${left}" y="${padT}" width="${width}" height="${innerH.toFixed(1)}" fill="transparent"/>`;
  }).join('');

  return`<svg class="line-chart" data-tip='${JSON.stringify(tipData).replace(/'/g,'&#39;')}' width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    ${gridLines}${seriesEls}${labelEls}
    <line class="chart-guide" x1="0" y1="${padT}" x2="0" y2="${(padT+innerH).toFixed(1)}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="2,2" opacity="0"/>
    ${hitCols}
  </svg>`;
}

function scoreClass(s){if(s==null)return'score-na';if(s>=4.5)return'score-5';if(s>=3.5)return'score-4';if(s>=2.5)return'score-3';if(s>=1.5)return'score-2';return'score-1';}

function computeScores(d){
  const s={};
  if(d.sites&&d.sites.total>0){
    const ep=d.sites.external_sharing/d.sites.total,tp=d.sites.teams_connected/d.sites.total;
    s.sharepoint={gov:+clamp(5-ep*4,0,5).toFixed(1),sec:+clamp(5-ep*3,0,5).toFixed(1),adopt:+clamp(tp*5,0,5).toFixed(1),mgmt:null};
  }
  if(d.files&&d.files.total>0){
    const sp=d.files.stale_2y/d.files.total;
    s.dados={gov:+clamp(5-sp*3,0,5).toFixed(1),sec:+(d.files.preserved>0?4.0:2.0).toFixed(1),adopt:null,mgmt:null};
  }
  if(d.sites&&d.sites.total>0){
    s.colaboracao={gov:null,sec:null,adopt:+(d.sites.teams_connected/d.sites.total*5).toFixed(1),mgmt:null};
  }
  return s;
}
function overallScore(sc){
  const v=[];Object.values(sc).forEach(d=>Object.values(d).forEach(x=>{if(x!=null)v.push(x)}));
  return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):null;
}

function computeRisks(d){
  const R=[];
  if(d.sites&&d.sites.total>0){
    const ep=pct(d.sites.external_sharing,d.sites.total);
    if(ep>=50)R.push({lvl:'high',title:'Alta exposição externa de dados',desc:`${ep}% dos sites com compartilhamento externo ativo`});
    else if(ep>=20)R.push({lvl:'medium',title:'Compartilhamento externo moderado',desc:`${d.sites.external_sharing} sites permitem acesso externo`});
    else if(ep>0)R.push({lvl:'low',title:'Compartilhamento externo limitado',desc:`${d.sites.external_sharing} site(s) com acesso externo`});
    if(pct(d.sites.teams_connected,d.sites.total)<30)R.push({lvl:'medium',title:'Baixa adoção do Microsoft Teams',desc:`Apenas ${pct(d.sites.teams_connected,d.sites.total)}% dos sites conectados ao Teams`});
  }
  if(d.files&&d.files.total>0){
    const sp=pct(d.files.stale_2y,d.files.total);
    if(sp>=40)R.push({lvl:'high',title:'Volume crítico de arquivos obsoletos',desc:`${sp}% dos arquivos sem modificação há mais de 2 anos`});
    else if(sp>=20)R.push({lvl:'medium',title:'Arquivos obsoletos detectados',desc:`${fmtNum(d.files.stale_2y)} arquivos sem edição nos últimos 2 anos`});
    const vb=d.files.versioned_bytes/Math.max(d.files.size_bytes,1);
    if(vb>3)R.push({lvl:'medium',title:'Overhead excessivo de versionamento',desc:`Versões ocupam ${vb.toFixed(1)}× mais espaço que os arquivos ativos`});
  }
  if(d.critical_sites&&d.critical_sites.length>0)
    R.push({lvl:'high',title:'Sites sensíveis com acesso externo',desc:`${d.critical_sites.length} site(s) com dados sensíveis e compartilhamento externo ativo`});
  if(d.trash&&d.trash.size_bytes>5*1073741824)
    R.push({lvl:'low',title:'Lixeira acima do esperado',desc:`${fmtGB(d.trash.size_bytes)} ocupando cota do tenant`});
  R.sort((a,b)=>({'high':0,'medium':1,'low':2,'info':3}[a.lvl]-{'high':0,'medium':1,'low':2,'info':3}[b.lvl]));
  return R.slice(0,7);
}

/* ── Savings ── recebe files/trash explicitos p/ reuso entre Visão Geral (tenant
   inteiro) e as abas SharePoint/OneDrive (já segmentadas pelo backend) */
function calcSavings(filesObj,trashObj,staleYears=2){
  const STORAGE=0.20;
  const trashGB=(trashObj&&trashObj.size_bytes||0)/1073741824;
  const versionGB=Math.max(0,((filesObj&&filesObj.versioned_bytes||0)-(filesObj&&filesObj.size_bytes||0))/1073741824);
  const staleKey='stale_'+staleYears+'y_bytes';
  const archiveGB=(filesObj&&filesObj[staleKey]||0)/1073741824;
  return{
    trash:trashGB*STORAGE,
    versions:versionGB*0.6*STORAGE,
    archive:archiveGB*STORAGE,
    total:trashGB*STORAGE+versionGB*0.6*STORAGE+archiveGB*STORAGE,
    trashGB,versionGB,archiveGB
  };
}

/* ── Organic growth projection ── recebe sites/files/trash explícitos p/ reuso
   entre execuções tenant-wide e as abas SharePoint/OneDrive já segmentadas.
   staleYears define tanto o corte de "Com arquivamento" quanto o da linha
   "Elegível p/ arquivamento" - selecionável via os botões 1/2/3/5 anos. ── */
function computeGrowth(s,f,t,growthMonthly,staleYears){
  staleYears=staleYears||2;
  s=s||{};f=f||{};t=t||{};
  const quotaB=(s.quota_mb||0)*1048576;
  const totalB=(s.storage_mb||0)*1048576;
  const activeB=f.size_bytes||0;
  // Taxa mensal: preferimos a media real dos ultimos meses (growth_monthly,
  // por data de criacao dos documentos - mesma fonte do grafico "Crescimento
  // Mês a Mês"). So cai pro heuristico (conteudo <2 anos / 24 meses) se ainda
  // nao houver historico com pelo menos 2 meses de dado real.
  const hist=(growthMonthly||[]).slice(-12).filter(r=>r&&(r.bytes_created_gb||0)>0);
  let monthlyB,rateSource;
  if(hist.length>=2){
    const sumGB=hist.reduce((a,r)=>a+(r.bytes_created_gb||0),0);
    monthlyB=(sumGB/hist.length)*1073741824;
    rateSource='historico';
  }else{
    const recentB=Math.max(0,activeB-(f.stale_2y_bytes||0));
    monthlyB=recentB/24;
    rateSource='estimativa';
  }
  const annualPct=totalB>0?(monthlyB*12/totalB*100):0;
  // "Com arquivamento" precisa refletir uma politica de arquivamento CONTINUA
  // (tudo que cruza +N anos sai, ano apos ano), nao uma limpeza unica em
  // "hoje" seguida do mesmo ritmo de crescimento bruto para sempre - senao os
  // dois numeros nao conferem (ex.: arquivar 14TB no Ano 5 mas "sobrar" 19TB
  // mesmo assim). Por isso reaproveita a MESMA previsao usada na linha
  // "Elegível p/ arquivar" (computeArchiveForecast, por data de criação) e
  // subtrai o volume elegível de cada ano do "sem ação" daquele ano. Lixeira
  // e overhead de versões continuam como um corte assumido mantido (higiene
  // contínua), nao apenas em "hoje".
  const fc=computeArchiveForecast(growthMonthly,staleYears);
  const vOver=Math.max(0,(f.versioned_bytes||0)-activeB);
  const trashPlusOverheadB=(t.size_bytes||0)+vOver*0.6;
  const years=[0,1,2,3,4,5];
  const rows=years.map((y,i)=>{
    const noAction=totalB+monthlyB*12*y;
    const archivedB=fc?fc.rows[i].archivedGB*1073741824:0;
    return{
      year:y,
      noAction,
      withClean:Math.max(0,noAction-archivedB-trashPlusOverheadB),
      archivedB,
      overQuota:quotaB>0&&noAction>quotaB
    };
  });
  // Months until quota full without action
  let monthsToFull=null;
  if(quotaB>0&&monthlyB>0){
    const rem=quotaB-totalB;
    if(rem>0)monthsToFull=Math.floor(rem/monthlyB);
  }
  const cleanB=rows[0].withClean;
  return{quotaB,totalB,cleanB,monthlyB,annualPct,rows,monthsToFull,rateSource,histMonths:hist.length,fc};
}

/* ── Expectativa de arquivamento: quanto do que existe hoje (mais o que ainda
   vai ser criado, no ritmo real observado) vai cruzar o limite de inatividade
   de N anos em cada ano futuro. Ex.: em "Ano 2", tudo criado até 2 anos antes
   daquela data já se qualifica - reaproveita growth_monthly (mesma fonte do
   gráfico "Crescimento Mês a Mês", por data de criação) tanto pro histórico
   real quanto pra extrapolar a criação futura. ──*/
function computeArchiveForecast(growthMonthly,staleYears){
  const hist=(growthMonthly||[])
    .filter(r=>r&&Number.isFinite(r.year)&&Number.isFinite(r.month))
    .map(r=>({date:new Date(r.year,r.month-1,1),cum:r.acumulado_gb||0,created:r.bytes_created_gb||0}))
    .sort((a,b)=>a.date-b.date);
  if(hist.length<2)return null;

  const last=hist[hist.length-1];
  const recent=hist.slice(-12).filter(h=>h.created>0);
  const monthlyGB=recent.length>=2?recent.reduce((a,h)=>a+h.created,0)/recent.length:0;

  function cumAt(date){
    if(date<hist[0].date)return 0;
    if(date<=last.date){
      let v=0;
      for(const h of hist){if(h.date<=date)v=h.cum;else break;}
      return v;
    }
    const monthsBeyond=(date.getFullYear()-last.date.getFullYear())*12+(date.getMonth()-last.date.getMonth());
    return last.cum+monthlyGB*monthsBeyond;
  }

  const today=new Date();
  const rows=[0,1,2,3,4,5].map(y=>{
    const target=new Date(today.getFullYear()+y,today.getMonth(),1);
    const threshold=new Date(target.getFullYear()-staleYears,target.getMonth(),1);
    return{year:y,archivedGB:Math.max(0,cumAt(threshold))};
  });
  return{rows,monthlyGB,histMonths:recent.length};
}

  const blocks=variants.map(({n,g,fc})=>{
    const active=n===2;
    const maxB=g.quotaB>0?g.quotaB:Math.max(...g.rows.map(r=>r.noAction))*1.05;

    const quota2txt=g.monthsToFull!=null

        <div class="og-rate-item"><span class="og-rate-val">${fmtNum(g.annualPct,1)}%</span><span>taxa anual de crescimento</span></div>

/* ── Waterfall de recuperação de espaço + previsibilidade (sites/files/trash segmentados) ── */
function renderGrowthWaterfall(sitesObj,filesObj,trashObj){
  const sites=sitesObj||{};const files=filesObj||{};const trash=trashObj||{};
  const sav=calcSavings(files,trash,2);
  const storagePct=pct(sites.storage_mb,sites.quota_mb);
  const storageColor=storagePct>80?'var(--red)':storagePct>60?'var(--yellow)':'var(--ct-orange)';
  const totalBytes=(sites.storage_mb||0)*1048576;
  const afterTrash=Math.max(0,totalBytes-(trash.size_bytes||0));
  const vOverhead=Math.max(0,(files.versioned_bytes||0)-(files.size_bytes||0));
  const afterVersions=Math.max(0,afterTrash-vOverhead*0.6);
  const archiveBytes=files.stale_2y_bytes||0;
  const afterArchive=Math.max(0,afterVersions-archiveBytes);
  const quotaBytes=(sites.quota_mb||1)*1048576;
  const monthsGained=quotaBytes>0&&totalBytes>0?Math.round((totalBytes-afterArchive)/quotaBytes*12*4):0;
  const pctRecovered=totalBytes>0?Math.round((totalBytes-afterArchive)/totalBytes*100):0;

  return`
  <div class="growth-grid">
    <div class="metric-card">
      <div class="metric-card-hd">
        <svg viewBox="0 0 16 16" fill="var(--ct-orange)"><path d="M0 0h1v15h15v1H0zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .704-.07z"/></svg>
        <span class="metric-card-title">Waterfall de Recuperação de Espaço</span>
      </div>
      <div class="waterfall">
        <div class="wf-row">
          <div class="wf-lbl"><span class="wf-title">Estado atual</span><span class="wf-value" style="color:${storageColor}">${fmtGB(totalBytes)}</span></div>
          <div class="wf-bar"><div class="wf-fill" style="width:100%;background:${storageColor}"></div></div>
        </div>
        <div class="wf-row">
          <div class="wf-lbl"><span class="wf-title">Após limpar lixeira</span><span class="wf-value">${fmtGB(afterTrash)}</span></div>
          <div class="wf-bar"><div class="wf-fill" style="width:${pct(afterTrash,totalBytes||1)}%;background:var(--yellow)"></div></div>
          ${trash.size_bytes>0?`<div class="wf-delta">▼ ${fmtGB(trash.size_bytes)} recuperados</div>`:''}
        </div>
        <div class="wf-row">
          <div class="wf-lbl"><span class="wf-title">Após reduzir versões (60%)</span><span class="wf-value">${fmtGB(afterVersions)}</span></div>
          <div class="wf-bar"><div class="wf-fill" style="width:${pct(afterVersions,totalBytes||1)}%;background:var(--ct-orange)"></div></div>
          ${vOverhead>0?`<div class="wf-delta">▼ ${fmtGB(vOverhead*0.6)} recuperados</div>`:''}
        </div>
        <div class="wf-row">
          <div class="wf-lbl"><span class="wf-title">Após arquivar conteúdo +2 anos</span><span class="wf-value" style="color:var(--green)">${fmtGB(afterArchive)}</span></div>
          <div class="wf-bar"><div class="wf-fill" style="width:${pct(afterArchive,totalBytes||1)}%;background:var(--ct-green)"></div></div>
          ${archiveBytes>0?`<div class="wf-delta">▼ ${fmtGB(archiveBytes)} movidos para arquivo frio</div>`:''}
        </div>
      </div>
    </div>
    <div class="metric-card">
      <div class="metric-card-hd">
        <svg viewBox="0 0 16 16" fill="var(--ct-green)"><path d="M1 11a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1zm5-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zm5-5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1z"/></svg>
        <span class="metric-card-title">Previsibilidade de Redução</span>
      </div>
      <div class="runway-panel">
        <div class="runway-stat">
          <div class="runway-big" style="color:var(--ct-orange)">${fmtUSD(sav.total)}</div>
          <div class="runway-sub">economia mensal total (armazenamento @ $0,20/GB/mês)</div>
        </div>
        <div class="runway-divider"></div>
        <div class="runway-stat">
          <div class="runway-big" style="color:var(--green)">${pctRecovered}%</div>
          <div class="runway-sub">do espaço atual pode ser recuperado com as 3 ações</div>
        </div>
        <div class="runway-divider"></div>
        <div class="runway-stat">
          <div class="runway-big" style="color:var(--purple)">${fmtGB(totalBytes-afterArchive)}</div>
          <div class="runway-sub">total recuperável — ${fmtGB(afterArchive)} seria o novo estado operacional</div>
        </div>
        ${monthsGained>0?`
        <div class="runway-divider"></div>
        <div class="runway-stat">
          <div class="runway-big" style="color:var(--ct-green)">+${monthsGained} meses</div>
          <div class="runway-sub">de runway estimado na cota com plano de arquivamento completo</div>
        </div>`:''}
      </div>
    </div>
  </div>`;
}

  const hist=EXEC_HISTORY;
  const histCardHd=`<div class="metric-card-hd">
    <svg viewBox="0 0 16 16" fill="var(--ct-orange)"><path d="M0 0h1v15h15v1H0zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .704-.07z"/></svg>
    <span class="metric-card-title">Histórico de Execuções — Sites &amp; Arquivos</span>
  </div>`;
  if(!hist||hist.length<2){
    return`<div class="metric-card" style="margin-bottom:22px">${histCardHd}
      <div class="empty-msg">Histórico insuficiente — apenas ${hist?hist.length:0} execução(ões) registrada(s). Execute o assessment novamente para visualizar a tendência entre execuções.</div>
    </div>`;
  }
  const asc=hist.slice().reverse();
  const labels=asc.map(e=>{
    const dt=e.start_time?new Date(e.start_time):null;
    return dt&&!isNaN(dt)?dt.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'}):(e.execution_id||'').substring(0,6);
  });
  const chart=lineChart([
    {values:asc.map(e=>e.sites||0),color:'var(--ct-orange)',area:true,name:'Sites'},
    {values:asc.map(e=>e.files||0),color:'var(--purple)',area:false,name:'Arquivos'},
  ],labels,{h:190,fmt:v=>fmtNum(Math.round(v))});

  const cur=asc[asc.length-1],prev=asc[asc.length-2];
  const dSites=(cur.sites||0)-(prev.sites||0);
  const dFiles=(cur.files||0)-(prev.files||0);
  const fmtDelta=v=>`${v>0?'+':''}${fmtNum(v)}`;

  return`
  <div class="exec-hist-grid">
    <div class="metric-card">
      ${histCardHd}
      <div class="chart-legend">
        <div class="chart-legend-item"><span class="chart-legend-line" style="background:var(--ct-orange)"></span>Sites</div>
        <div class="chart-legend-item"><span class="chart-legend-line" style="background:var(--purple)"></span>Arquivos</div>
      </div>
      <div class="chart-card-body">${chart}</div>
    </div>
    <div class="metric-card">
      <div class="metric-card-hd">
        <svg viewBox="0 0 16 16" fill="var(--ct-green)"><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m.93-9.412-1 4.705c-.07.34.029.533.304.533.194 0 .487-.07.686-.246l-.088.416c-.287.346-.92.598-1.465.598-.703 0-1.002-.422-.808-1.319l.738-3.468c.064-.293.006-.399-.287-.47l-.451-.081.082-.381 2.29-.287zM8 5.5a1 1 0 1 1 0-2 1 1 0 0 1 0 2"/></svg>
        <span class="metric-card-title">Resumo entre Execuções</span>
      </div>
      <div style="padding:4px 0">
        <div class="mrow"><span class="mrow-lbl">Total de execuções</span><span class="mrow-val">${fmtNum(hist.length)}</span></div>
        <div class="mrow"><span class="mrow-lbl">Δ Sites vs. anterior</span><span class="mrow-val ${dSites>=0?'c-green':'c-red'}">${fmtDelta(dSites)}</span></div>
        <div class="mrow"><span class="mrow-lbl">Δ Arquivos vs. anterior</span><span class="mrow-val ${dFiles>=0?'c-green':'c-red'}">${fmtDelta(dFiles)}</span></div>
        <div class="mrow"><span class="mrow-lbl">Execução anterior</span><span class="mrow-val" style="font-weight:400;font-size:11px">${prev.start_time||'—'}</span></div>
        <div class="mrow"><span class="mrow-lbl">Execução atual</span><span class="mrow-val" style="font-weight:400;font-size:11px">${cur.start_time||'—'}</span></div>
      </div>
    </div>
  </div>`;
}

/* ── Main render ── */
function render(d,execId){
  if(d.error)return`<div class="error-box">Erro ao carregar dados: ${d.error}</div>`;
  if(d.mode==='csv')return`<div class="error-box">${d.error||'store_in_sql não habilitado.'}</div>`;

  const scores=computeScores(d);
  const overall=overallScore(scores);
  const risks=computeRisks(d);
  const sites=d.sites||{total:0};
  const files=d.files||{total:0};
  const trash=d.trash||{total:0,size_bytes:0};
  const sav=calcSavings(files,trash,2);
  const storagePct=pct(sites.storage_mb,sites.quota_mb);

  /* Todos os sites, segmentados SharePoint x OneDrive */
  const allSites=d.all_sites||[];
  SITE_TABLES.sharepoint=allSites.filter(s=>s.site_type!=='OneDrive');
  SITE_TABLES.onedrive=allSites.filter(s=>s.site_type==='OneDrive');
  DEVICE_TABLE=d.intune_devices||[];
  LICENSING_SKUS=d.licensing_by_sku||[];
  ADOPTION_INACTIVE=d.adoption_inactive_users||[];
  MAILBOX_LIST=d.mailbox_list||[];

  /* Hero */
  const heroHTML=sav.total>0?`
  <div class="hero">
    <div class="hero-layout">
      <div>
        <div class="hero-eyebrow">Diagnóstico de Custo · SharePoint Online</div>
        <div class="hero-amount">${fmtUSD(sav.total)}<span>/mês</span></div>
        <div class="hero-desc">em armazenamento recuperável identificado — lixeira, histórico de versões e conteúdo sem acesso há mais de 2 anos.</div>
      </div>
      <div class="hero-pills">
        ${sav.trash>0.1?`<div class="hero-pill"><div class="hero-pill-label">Lixeira</div><div class="hero-pill-value">${fmtUSD(sav.trash)}</div><div class="hero-pill-period">/mês</div></div>`:''}
        ${sav.versions>0.1?`<div class="hero-pill"><div class="hero-pill-label">Versões</div><div class="hero-pill-value">${fmtUSD(sav.versions)}</div><div class="hero-pill-period">/mês</div></div>`:''}
        ${sav.archive>0.5?`<div class="hero-pill"><div class="hero-pill-label">Arquivamento</div><div class="hero-pill-value">${fmtUSD(sav.archive)}</div><div class="hero-pill-period">/mês</div></div>`:''}
      </div>
    </div>
  </div>`:`
  <div class="hero" style="background:linear-gradient(135deg,#1a5c32 0%,#0d3d22 100%)">
    <div class="hero-layout" style="grid-template-columns:1fr">
      <div>
        <div class="hero-eyebrow">Diagnóstico de Custo · SharePoint Online</div>
        <div class="hero-amount" style="font-size:40px">Ambiente eficiente<span style="font-size:16px"> — sem oportunidades críticas.</span></div>
        <div class="hero-desc">Nenhuma oportunidade de redução significativa identificada neste assessment.</div>
      </div>
    </div>
  </div>`;

  /* KPI strip — cartões com ícone e, quando há histórico real de execuções, sparkline */
  const histAsc=EXEC_HISTORY.slice().reverse(); // mais antiga primeiro
  const sitesSpark=histAsc.length>=2?sparkline(histAsc.map(e=>e.sites||0),'var(--ct-orange)'):'';
  const sitesTrendPct=(()=>{
    if(histAsc.length<2)return null;
    const prev=histAsc[histAsc.length-2].sites||0,cur=histAsc[histAsc.length-1].sites||0;
    return prev>0?Math.round((cur-prev)/prev*100):null;
  })();
  const kpiHTML=`
  <div class="kpi-strip">
    <div class="kpi-card">
      <div class="kpi-top">
        <div class="kpi-icon" style="background:rgba(234,90,28,.14)">
          <svg viewBox="0 0 16 16" fill="var(--ct-orange)"><path d="M2.5 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm2 0a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm2 0a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zM2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2H2zm13 2v2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1zM2 14a1 1 0 0 1-1-1V6h14v7a1 1 0 0 1-1 1H2z"/></svg>
        </div>
        ${sitesTrendPct!=null?`<span class="kpi-delta ${sitesTrendPct>=0?'up':'down'}">${sitesTrendPct>=0?'▲':'▼'} ${Math.abs(sitesTrendPct)}%</span>`:''}
      </div>
      <div class="kpi-label">Sites Criados</div>
      <div class="kpi-value c-orange">${fmtNum(sites.total)}</div>
      <div class="kpi-sub">${fmtNum(sites.subsites)} subsites · ${fmtNum(sites.teams_connected)} c/ Teams</div>
      ${sitesSpark}
    </div>
    <div class="kpi-card">
      <div class="kpi-top">
        <div class="kpi-icon" style="background:rgba(248,81,73,.14)">
          <svg viewBox="0 0 16 16" fill="var(--red)"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.964 0L.165 13.233c-.457.778.091 1.767.982 1.767h13.706c.891 0 1.439-.99.982-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/></svg>
        </div>
      </div>
      <div class="kpi-label">Acesso Externo</div>
      <div class="kpi-value c-red">${fmtNum(sites.external_sharing)}</div>
      <div class="kpi-sub">${pct(sites.external_sharing,sites.total)}% dos sites expõem dados externamente</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top">
        <div class="kpi-icon" style="background:rgba(210,153,34,.14)">
          <svg viewBox="0 0 16 16" fill="var(--yellow)"><path d="M1 2a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v1h12V2a1 1 0 0 0-1-1z"/></svg>
        </div>
      </div>
      <div class="kpi-label">Armazenamento</div>
      <div class="kpi-value c-yellow">${fmtMB(sites.storage_mb)}</div>
      <div class="kpi-sub">${storagePct}% da cota · total ${fmtMB(sites.quota_mb)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top">
        <div class="kpi-icon" style="background:rgba(194,115,226,.14)">
          <svg viewBox="0 0 16 16" fill="var(--purple)"><path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m0-1A7 7 0 1 1 8 1a7 7 0 0 1 0 14"/></svg>
        </div>
      </div>
      <div class="kpi-label">Conteúdo Inativo +2 anos</div>
      <div class="kpi-value c-purple">${fmtNum(files.stale_2y||0)}</div>
      <div class="kpi-sub">${fmtGB(files.stale_2y_bytes||0)} recuperáveis via arquivamento</div>
    </div>
  </div>`;

  /* Maturity + Risks */
  const DOMAINS=[
    {key:'sharepoint',label:'SharePoint Online'},
    {key:'dados',label:'Dados & Compliance'},
    {key:'colaboracao',label:'Colaboração'},
    {key:'identidade',label:'Identidade'},
    {key:'dispositivos',label:'Dispositivos'},
  ];
  const matRows=DOMAINS.map(dom=>{
    const sc=scores[dom.key];
    if(!sc)return`<tr><td>${dom.label}</td><td>${renderCell(null)}</td><td>${renderCell(null)}</td><td>${renderCell(null)}</td><td>${renderCell(null)}</td></tr>`;
    const avg=[sc.gov,sc.sec,sc.adopt,sc.mgmt].filter(v=>v!=null);
    const da=avg.length?+(avg.reduce((a,b)=>a+b,0)/avg.length).toFixed(1):null;
    return`<tr><td style="font-size:12px;padding:9px 13px">${dom.label}</td><td>${renderCell(sc.gov)}</td><td>${renderCell(sc.sec)}</td><td>${renderCell(sc.adopt)}</td><td>${renderCell(da)}</td></tr>`;
  }).join('');

  const riskHTML=risks.length===0
    ?'<div class="no-risk">Nenhum risco identificado.</div>'
    :`<ul class="risk-list">${risks.map(r=>`<li class="risk-item">
        <span class="risk-dot ${r.lvl}"></span>
        <div><div class="risk-title"><span class="risk-badge ${r.lvl}">${{high:'Crítico',medium:'Médio',low:'Baixo'}[r.lvl]||r.lvl}</span>${r.title}</div>
        <div class="risk-desc">${r.desc}</div></div>
      </li>`).join('')}</ul>`;

  /* Critical sites */
  const critRows=(d.critical_sites||[]).map(s=>{
    const kw=critKeyword(s.url,s.title);
    return`<tr>
      <td>
        <div class="crit-title"><span class="crit-badge">Externo</span>${s.title||'(sem nome)'}${kw?` <span class="kw-tag">${kw.trim().toUpperCase()}</span>`:''}</div>
        <div class="crit-url">${s.url}</div>
      </td>
      <td class="crit-cap">${s.capability||'—'}</td>
      <td style="text-align:right;font-size:12px;font-weight:600">${fmtGB(s.storage_bytes)}</td>
    </tr>`;
  }).join('');
  const critHTML=`
  <div class="mat-card" style="margin-bottom:22px">
    <table class="crit-table">
      <thead><tr><th>Site</th><th>Compartilhamento</th><th style="text-align:right">Tamanho</th></tr></thead>
      <tbody>${critRows||`<tr><td colspan="3"><div class="empty-crit">Nenhum site sensível com acesso externo identificado.</div></td></tr>`}</tbody>
    </table>
  </div>`;


  const tabBarHTML=`
  <div class="tab-bar">
    <button class="tab-btn active" data-tab="overview">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8"/><path d="M8 4a.5.5 0 0 1 .5.5v3.5h3a.5.5 0 0 1 0 1h-3.5A.5.5 0 0 1 7.5 8.5v-4A.5.5 0 0 1 8 4"/></svg>
      Visão Geral
    </button>
    <button class="tab-btn" data-tab="licensing">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.804.804 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3zM15 6.437l-5.577 2.693c-.541.262-1.204.262-1.746 0L2 6.437V11.5A1.5 1.5 0 0 0 3.5 13h9a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      Licenciamento <span class="tab-count">${(LICENSING_SKUS||[]).length}</span>
    </button>
    <button class="tab-btn" data-tab="adoption">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/></svg>
      Adoção <span class="tab-count">${(ADOPTION_INACTIVE||[]).length}</span>
    </button>
    <button class="tab-btn" data-tab="intune">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M13.5 3a.5.5 0 0 1 .5.5V11H2V3.5a.5.5 0 0 1 .5-.5zm-11-1A1.5 1.5 0 0 0 1 3.5V12h14V3.5A1.5 1.5 0 0 0 13.5 2zM0 12.5h16a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 0 12.5"/></svg>
      Intune <span class="tab-count">${DEVICE_TABLE.length}</span>
    </button>
    <button class="tab-btn" data-tab="exchange">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 3A1.5 1.5 0 0 0 1 4.5v.793c.026.009.051.02.076.032L7.674 8.51c.206.1.446.1.652 0l6.598-3.185A.804.804 0 0 1 15 5.293V4.5A1.5 1.5 0 0 0 13.5 3zM15 6.437l-5.577 2.693c-.541.262-1.204.262-1.746 0L2 6.437V11.5A1.5 1.5 0 0 0 3.5 13h9a1.5 1.5 0 0 0 1.5-1.5z"/></svg>
      Exchange <span class="tab-count">${MAILBOX_LIST.length}</span>
    </button>
    <button class="tab-btn" data-tab="sharepoint">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M2.5 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm2 0a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm2 0a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zM2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2H2zm13 2v2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1zM2 14a1 1 0 0 1-1-1V6h14v7a1 1 0 0 1-1 1H2z"/></svg>
      SharePoint <span class="tab-count">${SITE_TABLES.sharepoint.length}</span>
    </button>
    <button class="tab-btn" data-tab="onedrive">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4.318 8.62a3.5 3.5 0 0 0-3.024 1.75A3.5 3.5 0 0 0 4.5 15h9a2.5 2.5 0 0 0 .958-4.808 3.5 3.5 0 0 0-4.35-4.153 4.5 4.5 0 0 0-8.37 2.462q0 .264.033.523A3.5 3.5 0 0 0 0 12.5"/></svg>
      OneDrive <span class="tab-count">${SITE_TABLES.onedrive.length}</span>
    </button>
  </div>`;

  const overviewHTML=`
  <div class="sec-hd"><div class="sec-hd-accent"></div>Histórico de Execuções</div>
  ${renderExecHistory()}
  <div class="sec-hd"><div class="sec-hd-accent"></div>Análise de Maturidade</div>
  <div class="two-col">
    <div class="mat-card">
      <table class="mat-table">
        <thead><tr><th>Domínio</th><th>Governança</th><th>Segurança</th><th>Adoção</th><th>Média</th></tr></thead>
        <tbody>${matRows}</tbody>
      </table>
    </div>
    <div class="risk-card">
      <div class="risk-hd"><div class="risk-hd-title">Riscos Identificados</div><div class="risk-hd-sub">${risks.length} pontos de atenção</div></div>
      ${riskHTML}
    </div>
  </div>
  <div class="sec-hd"><div class="sec-hd-accent"></div>Arquivos Duplicados — Candidatos a Deduplicação</div>
  ${duplicatesTableHTML(d.duplicates)}`;

  return tabBarHTML+`
  <div class="tab-panel active" data-tab="overview">${heroHTML}${kpiHTML}${overviewHTML}</div>
  <div class="tab-panel" data-tab="licensing">${renderLicensingTab(d)}</div>
  <div class="tab-panel" data-tab="adoption">${renderAdoptionTab(d)}</div>
  <div class="tab-panel" data-tab="intune">${renderIntuneTab(d)}</div>
  <div class="tab-panel" data-tab="exchange">${renderExchangeTab(d)}</div>
  <div class="tab-panel" data-tab="sharepoint">${renderSharePointTab(d,critHTML)}</div>
  <div class="tab-panel" data-tab="onedrive">${renderOneDriveTab(d)}</div>`;
}

/* ── Aba SharePoint: sites, tipos de arquivo, top 10/20, lixeira, higienização,
   arquivamento e crescimento mês a mês — tudo já segmentado pelo backend
   (d.sharepoint.*, ver docs/migration_002_sp_od_tabs.sql) ── */
function renderSharePointTab(d,critHTML){
  const sp=d.sharepoint||{};
  const spSites=sp.sites||{total:0};
  const spFiles=sp.files||{total:0};
  const spTrash=sp.trash||{total:0,size_bytes:0};

  const top10Size=SITE_TABLES.sharepoint.slice().sort((a,b)=>(b.size_bytes||0)-(a.size_bytes||0)).slice(0,10);
  const top10Files=SITE_TABLES.sharepoint.slice().sort((a,b)=>(b.total_files||0)-(a.total_files||0)).slice(0,10);

  const growthChart=(sp.growth_monthly&&sp.growth_monthly.length>0)?(()=>{
    const labels=sp.growth_monthly.map(r=>`${String(r.month).padStart(2,'0')}/${String(r.year).slice(2)}`);
    const chart=lineChart([
      {values:sp.growth_monthly.map(r=>r.bytes_created_gb||0),color:'var(--ct-orange)',area:false,name:'Criado no mês'},
      {values:sp.growth_monthly.map(r=>r.acumulado_gb||0),color:'var(--ct-green)',area:true,name:'Acumulado'},
    ],labels,{h:190,fmt:v=>fmtNum(Math.round(v))+'GB'});
    return`<div class="metric-card" style="margin-bottom:22px">
      <div class="metric-card-hd">
        <svg viewBox="0 0 16 16" fill="var(--ct-orange)"><path d="M0 0h1v15h15v1H0zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .704-.07z"/></svg>
        <span class="metric-card-title">Crescimento Mês a Mês (por data de criação dos documentos)</span>
      </div>
      <div class="chart-legend">
        <div class="chart-legend-item"><span class="chart-legend-line" style="background:var(--ct-orange)"></span>Criado no mês</div>
        <div class="chart-legend-item"><span class="chart-legend-line" style="background:var(--ct-green)"></span>Acumulado</div>
      </div>
      <div class="chart-card-body">${chart}</div>
    </div>`;
  })():'<div class="empty-msg" style="margin-bottom:22px">Sem dados de data de criação suficientes para o gráfico de crescimento mensal.</div>';

  return`
  <div class="kpi-strip" style="margin-bottom:22px">
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-icon" style="background:rgba(234,90,28,.14)">
        <svg viewBox="0 0 16 16" fill="var(--ct-orange)"><path d="M2.5 4a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm2 0a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zm2 0a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1zM2 1a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V3a2 2 0 0 0-2-2H2zm13 2v2H1V3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1zM2 14a1 1 0 0 1-1-1V6h14v7a1 1 0 0 1-1 1H2z"/></svg>
      </div></div>
      <div class="kpi-label">Sites Criados (SharePoint)</div>
      <div class="kpi-value c-orange">${fmtNum(spSites.total)}</div>
      <div class="kpi-sub">${fmtNum(spSites.subsites)} subsites · ${fmtNum(spSites.teams_connected)} c/ Teams</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-icon" style="background:rgba(210,153,34,.14)">
        <svg viewBox="0 0 16 16" fill="var(--yellow)"><path d="M1 2a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2zm2-1a1 1 0 0 0-1 1v1h12V2a1 1 0 0 0-1-1z"/></svg>
      </div></div>
      <div class="kpi-label">Armazenamento</div>
      <div class="kpi-value c-yellow">${fmtMB(spSites.storage_mb)}</div>
      <div class="kpi-sub">${pct(spSites.storage_mb,spSites.quota_mb)}% da cota · total ${fmtMB(spSites.quota_mb)}</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-icon" style="background:rgba(248,81,73,.14)">
        <svg viewBox="0 0 16 16" fill="var(--red)"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.964 0L.165 13.233c-.457.778.091 1.767.982 1.767h13.706c.891 0 1.439-.99.982-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/></svg>
      </div></div>
      <div class="kpi-label">Acesso Externo</div>
      <div class="kpi-value c-red">${fmtNum(spSites.external_sharing)}</div>
      <div class="kpi-sub">${pct(spSites.external_sharing,spSites.total)}% dos sites expõem dados externamente</div>
    </div>
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-icon" style="background:rgba(194,115,226,.14)">
        <svg viewBox="0 0 16 16" fill="var(--purple)"><path d="M8 3.5a.5.5 0 0 0-1 0V9a.5.5 0 0 0 .252.434l3.5 2a.5.5 0 0 0 .496-.868L8 8.71z"/><path d="M8 16A8 8 0 1 0 8 0a8 8 0 0 0 0 16m0-1A7 7 0 1 1 8 1a7 7 0 0 1 0 14"/></svg>
      </div></div>
      <div class="kpi-label">Conteúdo Inativo +2 anos</div>
      <div class="kpi-value c-purple">${fmtNum(spFiles.stale_2y||0)}</div>
      <div class="kpi-sub">${fmtGB(spFiles.stale_2y_bytes||0)} recuperáveis via arquivamento</div>
    </div>
  </div>
  <div class="sec-hd"><div class="sec-hd-accent"></div>Sites Sensíveis com Acesso Externo</div>
  ${critHTML}
  <div class="sec-hd"><div class="sec-hd-accent"></div>Sites sem Dono Ativo</div>
  ${orphanedSitesTableHTML(sp.orphaned_sites)}
  <div class="sec-hd"><div class="sec-hd-accent"></div>Top 10 Sites — Tamanho &amp; Quantidade de Arquivos</div>
  <div class="two-col" style="grid-template-columns:1fr 1fr">
    ${topSitesTableHTML(top10Size,'Sem sites.')}
    ${topSitesTableHTML(top10Files,'Sem sites.')}
  </div>
  <div class="sec-hd"><div class="sec-hd-accent"></div>Todos os Sites — SharePoint</div>
  ${renderSitesTable('sites-tbody-sp',SITE_TABLES.sharepoint,'Nenhum site do SharePoint encontrado.')}
  <div class="sec-hd"><div class="sec-hd-accent"></div>Tipos de Arquivo &amp; Visão Geral</div>
  ${renderFilesOverview(spFiles,sp.file_types,null)}
  <div class="sec-hd"><div class="sec-hd-accent"></div>Top 20 — Mais Versões &amp; Mais Pesados</div>
  <div class="two-col" style="grid-template-columns:1fr 1fr">
    ${topVersionedTableHTML(sp.top_versioned)}
    ${topVersionedTableHTML(sp.top_heaviest,'Nenhum arquivo encontrado.')}
  </div>
  <div class="sec-hd"><div class="sec-hd-accent"></div>Oportunidades de Redução — Lixeira, Versões &amp; Arquivamento</div>
  ${renderDiagCards(spFiles,spTrash,sp.version_savings)}
  <div class="sec-hd"><div class="sec-hd-accent"></div>Armazenamento &amp; Lixeira</div>
  ${renderStorageRow(spSites,spTrash)}
  <div class="sec-hd"><div class="sec-hd-accent"></div>Crescimento Mês a Mês</div>
  ${growthChart}
  <div class="sec-hd"><div class="sec-hd-accent"></div>Waterfall de Redução &amp; Projeção 5 Anos</div>
  ${renderGrowthWaterfall(spSites,spFiles,spTrash)}
  ${renderGrowth(spSites,spFiles,spTrash,sp.growth_monthly)}`;
}

/* ── Aba OneDrive: top usuários (por tamanho), tipos de arquivo, top 20
   versionados e um resumo de higienização — d.onedrive.* (backend) ── */
function renderOneDriveTab(d){
  const od=d.onedrive||{};
  const odSites=od.sites||{total:0};

function fmtDaysAgo(iso){
  if(!iso)return'Nunca';
  const dt=new Date(iso);
  if(isNaN(dt))return'Nunca';
  const days=Math.floor((Date.now()-dt.getTime())/86400000);
  if(days<=0)return'Hoje';
  if(days===1)return'1 dia atrás';
  return`${fmtNum(days)} dias atrás`;
}
function sortDevices(arr,mode){
  const c=arr.slice();
  if(mode==='checkin')c.sort((a,b)=>new Date(b.last_checkin_date||0)-new Date(a.last_checkin_date||0));
  else if(mode==='name')c.sort((a,b)=>(a.device_name||'').localeCompare(b.device_name||''));
  else c.sort((a,b)=>(b.has_risk?1:0)-(a.has_risk?1:0));
  return c;
}
function ownerTypeLabel(t){
  const m={company:'Corporativo',personal:'Pessoal (BYOD)',unknown:'Desconhecido'};
  return m[(t||'').toLowerCase()]||t||'Desconhecido';
}
function intuneDeviceRowsHTML(rows){
  if(!rows.length)return`<tr><td colspan="6"><div class="empty-crit">Nenhum dispositivo encontrado.</div></td></tr>`;
  const avOk=s=>['uptodate','enabled','secured'].includes((s||'').toLowerCase());
  return rows.map(dv=>`<tr>
    <td>
      <div class="crit-title">${dv.has_risk?'<span class="crit-badge">Risco</span>':''}${dv.owner_type==='personal'?'<span class="crit-badge" style="background:rgba(210,153,34,.18);color:var(--yellow)">BYOD</span>':''}${dv.device_name||'(sem nome)'}</div>

    </td>

    <td>${dv.compliance_status==='compliant'?'<span class="c-green">Compliant</span>':`<span class="c-red">${dv.compliance_status||'unknown'}</span>`}</td>
    <td style="text-align:center">${dv.is_encrypted?'<span class="c-green">Sim</span>':'<span class="c-red">Não</span>'}</td>
    <td style="text-align:center">${avOk(dv.antivirus_status)?'<span class="c-green">OK</span>':`<span class="c-red">${dv.antivirus_status||'unknown'}</span>`}</td>
    <td style="text-align:right;font-size:12px">${fmtDaysAgo(dv.last_checkin_date)}</td>

}
