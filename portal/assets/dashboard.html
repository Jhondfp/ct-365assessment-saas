function renderLicensingTab(d){
  const lic=d.licensing||{total_skus:0};
  const skus=LICENSING_SKUS;
  if(!lic.total_skus){
    return'<div class="empty-msg">Nenhuma licença coletada — habilite "process_licensing_info" em params.json e rode um novo assessment.</div>';
  }
  const overallPct=pct(lic.used_licenses,lic.total_licenses);

  // FinOps simplista: custo mensal ocioso = licencas disponiveis (nao
  // atribuidas) x preco de referencia do SKU. So soma SKUs com preco
  // conhecido em LICENSE_REF_PRICES; o resto fica de fora do $ (mas ainda
  // conta como licenca ociosa nos KPIs acima).
  const priced=skus
    .map(s=>({...s,refPrice:LICENSE_REF_PRICES[s.sku_part_number]||0}))
    .filter(s=>s.refPrice>0 && s.available_licenses>0)
    .map(s=>({...s,wastedUsd:s.available_licenses*s.refPrice}))
    .sort((a,b)=>b.wastedUsd-a.wastedUsd);
  const totalWastedUsd=priced.reduce((a,s)=>a+s.wastedUsd,0);
  const unpricedAvailable=skus.filter(s=>!LICENSE_REF_PRICES[s.sku_part_number]).reduce((a,s)=>a+(s.available_licenses||0),0);

  const finopsBannerHTML=totalWastedUsd>=1?`
  <div class="hero" style="margin-bottom:22px">
    <div class="hero-layout">
      <div>
        <div class="hero-eyebrow">FinOps · Licenciamento Ocioso</div>
        <div class="hero-amount">${fmtUSD(totalWastedUsd)}<span>/mês</span></div>
        <div class="hero-desc">em licenças pagas e não atribuídas a nenhum usuário — estimativa por preço de tabela público da Microsoft, pode não refletir o contrato/desconto real do cliente.${unpricedAvailable>0?` Há ainda ${fmtNum(unpricedAvailable)} licença(s) ociosa(s) em SKU(s) sem preço de referência, não incluídas neste valor.`:''}</div>
      </div>
      <div class="hero-pills">
        ${priced.slice(0,3).map(s=>`<div class="hero-pill"><div class="hero-pill-label">${s.friendly_name}</div><div class="hero-pill-value">${fmtUSD(s.wastedUsd)}</div><div class="hero-pill-period">/mês</div></div>`).join('')}
      </div>
    </div>
  </div>`:`
  <div class="hero" style="margin-bottom:22px;background:linear-gradient(135deg,#1a5c32 0%,#0d3d22 100%)">

        <div class="hero-desc">Nenhuma licença ociosa com custo de referência conhecido neste assessment.${unpricedAvailable>0?` (${fmtNum(unpricedAvailable)} licença(s) ociosa(s) em SKU(s) sem preço de referência cadastrado.)`:''}</div>

    </div>
    <div class="kpi-card">
      <div class="kpi-top"><div class="kpi-icon" style="background:rgba(63,185,80,.14)">

    return`<tr>
      <td>
        <div class="crit-title">${m.display_name||m.user_principal_name}</div>

      <td style="text-align:right;font-size:12px">${fmtNum(m.item_count)}</td>
      <td style="text-align:right;font-size:12px;font-weight:600">${fmtGB(m.storage_used_bytes)}</td>

    </tr>`;
  }).join('');
}

/* ── Aba Adoção: atividade real de usuários (docs/migration_018_adoption_dashboard.sql)
   — dbo.user_activity, requer "process_adoption_info": true + permissão Graph
   Reports.Read.All. Mesma fonte de dados do dashboard "Análise de Utilização
   do Microsoft 365" da própria Microsoft, focado em SharePoint/OneDrive/
   Exchange/Teams (últimos 30 dias). ── */
function adoptionBarsHTML(items){
  if(!items.length)return'<div class="empty-msg">Sem dados de adoção.</div>';
  return items.map(o=>{
    const activePct=o.licensed_users>0?Math.round(o.active_users/o.licensed_users*100):0;
    const barColor=activePct<30?'var(--red)':activePct<60?'var(--yellow)':'var(--ct-green)';
    return`<div class="mrow">
      <div style="display:flex;flex-direction:column;gap:4px;flex:1;margin-right:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px"><span>${o.service}</span><span style="font-weight:600">${activePct}% ativos</span></div>
        <div class="og-bar-wrap" style="height:6px">
          <div class="og-bar-fill" style="width:${activePct}%;background:${barColor}"></div>
        </div>
      </div>
      <div style="font-size:11px;color:var(--muted);white-space:nowrap">${fmtNum(o.active_users)} de ${fmtNum(o.licensed_users)} licenciados</div>
    </div>`;
  }).join('');
}
function adoptionInactiveRowsHTML(rows){
  if(!rows.length)return`<tr><td colspan="3"><div class="empty-crit">Nenhum usuário inativo encontrado.</div></td></tr>`;
  return rows.map(r=>`<tr>
    <td class="crit-title">${r.user_principal_name}</td>
    <td class="crit-cap">${r.service}</td>
    <td style="text-align:right;font-size:12px">${fmtDaysAgo(r.last_activity_date)}</td>
  </tr>`).join('');
}

    ${kpiCard('OneDrive',od,'M4.318 8.62a3.5 3.5 0 0 0-3.024 1.75A3.5 3.5 0 0 0 4.5 15h9a2.5 2.5 0 0 0 .958-4.808 3.5 3.5 0 0 0-4.35-4.153 4.5 4.5 0 0 0-8.37 2.462q0 .264.033.523A3.5 3.5 0 0 0 0 12.5')}

/* ── Execution selector ── */
let EXEC_HISTORY=[]; // mais recente primeiro (ordem da API)
async function loadExecutions(){
  const sel=document.getElementById('exec-select');
  try{
    const r=await fetch('/api/executions');
    const raw=await r.json();
    // ConvertTo-Json do PS retorna objeto (nao array) quando ha 1 item — normaliza
    const execs=Array.isArray(raw)?raw:(raw&&raw.execution_id?[raw]:[]);
    EXEC_HISTORY=execs;
    if(execs.length===0){sel.innerHTML='<option value="">Sem execuções</option>';return null;}
    sel.innerHTML=execs.map(e=>{
      const when=e.start_time||e.execution_id.substring(0,8)+'…';
      const label=e.client_name?`${e.client_name} — ${when}`:when;
      const parts=[];
      if(e.sites>0) parts.push(e.sites.toLocaleString('pt-BR')+' sites');
      if(e.files>0) parts.push(e.files.toLocaleString('pt-BR')+' arq.');
      return`<option value="${e.execution_id}">${label}${parts.length?' · '+parts.join(' · '):''}</option>`;
    }).join('');
    return execs[0].execution_id;
  }catch(err){
    sel.innerHTML='<option value="">Erro ao carregar</option>';
    return null;
  }
}

function renderHeaderRight(executionId){
  const wrap=document.getElementById('page-header-right');
  const cur=EXEC_HISTORY.find(e=>e.execution_id===executionId)||EXEC_HISTORY[0];
  const parts=[];
  if(cur&&cur.start_time){
    parts.push(`<div class="date-badge">
      <svg viewBox="0 0 16 16" fill="currentColor"><path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/></svg>
      Execução de ${cur.start_time}
    </div>`);
  }
  const idx=EXEC_HISTORY.findIndex(e=>e.execution_id===(cur&&cur.execution_id));
  const prev=idx>=0?EXEC_HISTORY[idx+1]:null; // API retorna mais recente primeiro
  if(cur&&prev&&prev.sites!=null&&cur.sites!=null){
    const d=(cur.sites||0)-(prev.sites||0);
    const cls=d>0?'up':d<0?'down':'flat';
    parts.push(`<span class="delta-badge ${cls}">${d>0?'▲':d<0?'▼':'—'} ${d>0?'+':''}${d} sites vs. execução anterior</span>`);
  }
  wrap.innerHTML=parts.join('');
}

/* ── Blocos de informação colapsáveis: cada ".sec-hd" vira um acordeão para
   o conteúdo (irmãos no DOM) até o próximo ".sec-hd". Começa colapsado -
   usuário expande o que quiser ver. Roda 1x por carga do dashboard. ── */
function initCollapsibles(){
  document.querySelectorAll('.sec-hd').forEach(hd=>{
    if(!hd.querySelector('.sec-chevron')){
      const chev=document.createElement('span');
      chev.className='sec-chevron';
      chev.innerHTML='<svg viewBox="0 0 16 16" fill="currentColor"><path d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708z"/></svg>';
      hd.appendChild(chev);
    }
    hd.classList.add('collapsed');
    let el=hd.nextElementSibling;
    while(el&&!el.classList.contains('sec-hd')){
      el.classList.add('sec-collapsed-content');
      el=el.nextElementSibling;
    }
  });
}

async function load(executionId){
  const el=document.getElementById('page-content');
  el.innerHTML='<div class="loading"><div class="spinner"></div> Carregando...</div>';
  try{
    const url=executionId?`/api/dashboard?execution=${encodeURIComponent(executionId)}`:'/api/dashboard';
    const r=await fetch(url);
    const d=await r.json();
    if(d.error&&!d.sites){el.innerHTML=`<div class="error-box">Erro: ${d.error}</div>`;return;}
    el.innerHTML=render(d,executionId);
    initCollapsibles();
    renderHeaderRight(executionId);
    const short=executionId?(executionId.length>12?executionId.substring(0,8)+'…':executionId):'';
    const now=new Date();
    document.getElementById('last-update-title').textContent=EXEC_HISTORY.length?`${EXEC_HISTORY.length} execução(ões)`:'Sem execuções';
    document.getElementById('last-update-sub').textContent='Exec '+(short||'atual')+' · '+now.toLocaleTimeString('pt-BR');
    document.getElementById('print-header-meta').textContent=`Execução ${short||'atual'} · Gerado em ${now.toLocaleDateString('pt-BR')} às ${now.toLocaleTimeString('pt-BR')}`;
    document.title='CT Assessment - Dashboard - '+now.toLocaleDateString('pt-BR').replace(/\//g,'-');
  }catch(e){
    el.innerHTML=`<div class="error-box">Falha ao conectar: ${e.message}<br><span style="opacity:.65">Verifique se o servidor está rodando em http://localhost:8099</span></div>`;
  }
}

async function init(){
  const firstExecId=await loadExecutions();
  await load(firstExecId);
  document.getElementById('exec-select').addEventListener('change',function(){load(this.value||null)});
  // Filtros de ano/versão + tooltip dos gráficos (mesma função reaproveitada
  // no HTML exportado - ver bindReportInteractions/exportHtmlReport)
  bindReportInteractions();
  // Ordenacao das tabelas "Todos os Sites" (SharePoint / OneDrive)
  document.addEventListener('change',function(e){
    const sel=e.target.closest('.sites-order-select');
    if(!sel)return;
    const targetId=sel.getAttribute('data-target');
    const key=targetId==='sites-tbody-od'?'onedrive':'sharepoint';
    const tbody=document.getElementById(targetId);
    if(!tbody)return;
    tbody.innerHTML=siteRowsHTML(sortSites(SITE_TABLES[key],sel.value));
  });
  // Ordenacao da tabela "Todos os Dispositivos" (aba Intune)
  document.addEventListener('change',function(e){
    const sel=e.target.closest('.devices-order-select');
    if(!sel)return;
    const tbody=document.getElementById('devices-tbody');
    if(!tbody)return;
    tbody.innerHTML=intuneDeviceRowsHTML(sortDevices(DEVICE_TABLE,sel.value));
  });
  // Abas Visão Geral / SharePoint / OneDrive
  document.addEventListener('click',function(e){
    const btn=e.target.closest('.tab-btn');
    if(!btn)return;
    const tab=btn.getAttribute('data-tab');
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b===btn));
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.getAttribute('data-tab')===tab));
  });
  // Blocos de informação colapsáveis (clique no cabeçalho da seção)
  document.addEventListener('click',function(e){
    const hd=e.target.closest('.sec-hd');
    if(!hd)return;
    const collapsed=hd.classList.toggle('collapsed');
    let el=hd.nextElementSibling;
    while(el&&!el.classList.contains('sec-hd')){
      el.classList.toggle('sec-collapsed-content',collapsed);
      el=el.nextElementSibling;
    }
  });
}
init();
</script>
